[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-local-experiments"
version = "0.1.0"
description = "Reproducible local evaluation harness for Jev-style typed-decision alternatives."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]
http = [
  "httpx>=0.28",
]

[project.scripts]
jevx = "jev_local_experiments.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
