[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "system1-alternatives-benchmark"
version = "0.1.0"
description = "Reproducible evaluation harness for System 1 typed-decision alternatives."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]
http = [
  "httpx>=0.28",
]

[project.scripts]
s1bench = "jev_local_experiments.cli:main"
jevx = "jev_local_experiments.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
