[workspace]
id = "system1-alternatives-benchmark"
name = "System1 Alternatives Benchmark"
mode = "local_open_source_evaluation"
benchmark_profile = "generic_typed_decisions"
service_scope = "system1_evaluation"

[paths]
alternatives = "alternatives"
benchmarks = "benchmarks"
docs = "docs"
results = "results"
database = "results/benchmark_lab.db"

[hardware]
gpu = "NVIDIA GPU or CPU"
vram_gib = 16
ram_gib = 64
os = "Windows"

[integrations]
google_api = false
gtm = false
ga4 = false
chrome = false
qdrant = false
hindsight = false

[benchmark]
reference_provider = "jev_reference"
reference_only = true
do_not_use_reference_outputs_as_training_labels = true
