[workspace]
id = "jev-local-experiments"
name = "JEV Local Experiments"
mode = "local_open_source_evaluation"
benchmark_profile = "generic_typed_decisions"
initializer_scaffold = "gtm-initialize"
service_scope = "non_gtm_non_ga4"

[paths]
alternatives = "alternatives"
benchmarks = "benchmarks"
docs = "docs"
results = "results"

[hardware]
gpu = "NVIDIA GeForce RTX 4060 Ti"
vram_gib = 16
ram_gib = 128
os = "Windows"

[integrations]
google_api = false
gtm = false
ga4 = false
chrome = true
qdrant = true
hindsight = false

[memory.hindsight]
enabled = false
status = "blocked_bank_provisioning"
bank_id = "codex-jev-local-experiments"
base_url = "http://192.168.31.229:8888"
llm_provider = "lmstudio"
llm_base_url = "http://192.168.31.13:1234/v1"
llm_model = "qwen3.6-35b-a3b-mtp"
embedding_url = "http://192.168.31.13:1234/v1"
embedding_model = "text-embedding-bge-m3"
embedding_dimensions = 1024

[benchmark]
reference_provider = "jev_reference"
reference_only = true
do_not_use_reference_outputs_as_training_labels = true
