[workspace]
id = "system1-bench"
name = "System1-Bench"
mode = "local_open_source_evaluation"
benchmark_profile = "generic_typed_decisions"
service_scope = "system1_evaluation"

[paths]
alternatives = "alternatives"
benchmarks = "benchmarks"
docs = "docs"
results = "results"
database = "results/benchmark_lab.db"

[hardware]
gpu = "NVIDIA GeForce RTX 4060 Ti"
vram_gib = 16
ram_gib = 128
os = "Windows"

[integrations]
google_api = false
gtm = false
ga4 = false
chrome = true
qdrant = true
hindsight = false

[memory.hindsight]
enabled = false
status = "disabled"
bank_id = "jev-local-experiments"
base_url = "http://127.0.0.1:8888"
llm_provider = "lmstudio"
llm_base_url = "http://127.0.0.1:1234/v1"
llm_model = "local-model"
embedding_url = "http://127.0.0.1:1234/v1"
embedding_model = "text-embedding-bge-m3"
embedding_dimensions = 1024

[benchmark]
reference_provider = "jev_reference"
reference_only = true
do_not_use_reference_outputs_as_training_labels = true
