# Example provider configuration for System1-Bench.
# Copy this file to config/providers.toml or config/providers.local.toml for local customization.
# Never commit real credentials or private file paths to git.

# Local candidate: Hearim (System One compatible)
[providers.hearim]
kind = "systemone_http"
enabled = true
install_dir = "alternatives/hearim"
base_url = "http://127.0.0.1:8013"
endpoint = "/v1/systemone"
model = "gemma4"
reference_only = false
training_use = true

[providers.hearim_qwen35_4b]
kind = "systemone_http"
enabled = true
install_dir = "alternatives/hearim"
base_url = "http://127.0.0.1:8013"
endpoint = "/v1/systemone"
model = "qwen35-4b"
reference_only = false
training_use = true

[providers.hearim_spark4b]
kind = "systemone_http"
enabled = true
install_dir = "alternatives/hearim"
base_url = "http://127.0.0.1:8013"
endpoint = "/v1/systemone"
model = "spark-4b"
reference_only = false
training_use = true

# Local candidate: Laya
[providers.laya]
kind = "systemone_http"
enabled = true
install_dir = "alternatives/laya"
base_url = "http://127.0.0.1:8014"
endpoint = "/v1/systemone"
model = "laya-typed-decisions"
reference_only = false
training_use = true

# Local candidate: Kev
[providers.kev]
kind = "systemone_http"
enabled = false
install_dir = "alternatives/kev"
base_url = "http://127.0.0.1:8009"
endpoint = "/v1/systemone"
model = "kev-latest"

# Local candidate: LM Studio (OpenAI compatible)
[providers.lm_studio]
kind = "openai_compatible"
enabled = false
install_dir = "alternatives/lm-studio"
base_url = "http://127.0.0.1:1234/v1"
endpoint = "/chat/completions"
model = "local-model-name"

# Reference baseline: hosted Jev API (evaluation only)
# Set the JEV_API_KEY environment variable (recommended) or specify api_key_file
[providers.jev_reference]
kind = "systemone_http"
enabled = true
install_dir = ""
base_url = "https://api.typesafe.ai"
endpoint = "/v1/systemone"
model = "jev-latest"
# api_key_file = "~/.codex/secrets/jev"
reference_only = true
training_use = false
